<div class="container">
  <h1>Employee Details</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Designation</th>
        <th>Address</th>
      </tr>
    </thead>
    <tbody>
      @for (employee of employees; track employee.id) {
        <tr>
          <td>{{ employee.id }}</td>
          <td>{{ employee.name }}</td>
          <td>{{ employee.age }}</td>
          <td>{{ employee.designation }}</td>
          <td>{{ employee.address }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
